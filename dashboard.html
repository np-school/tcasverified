<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แดชบอร์ด – NP-TCAS Verified</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="shared/styles.css" rel="stylesheet">
<script src="https://unpkg.com/lucide@1.24.0"></script>
<style>
  .profile-card{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));border-radius:18px;padding:20px 22px;color:#fff;margin-bottom:22px;flex-wrap:wrap;}
  .profile-avatar{width:64px;height:64px;border-radius:50%;border:2.5px solid rgba(255,255,255,.55);object-fit:cover;background:rgba(255,255,255,.18);flex-shrink:0;}
  .profile-name{font-size:18px;font-weight:800;}
  .profile-meta{font-size:12.5px;color:rgba(255,255,255,.85);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;}

  /* ── การ์ดสรุปสถานะ ── */
  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px;}
  .stat-card{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:box-shadow .15s,transform .15s;text-decoration:none;}
  .stat-card:hover{box-shadow:0 8px 20px rgba(0,0,0,.08);transform:translateY(-2px);}
  .stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .stat-count{font-size:26px;font-weight:800;color:var(--text);line-height:1;}
  .stat-label{font-size:12px;color:var(--text2);font-weight:700;}
  .stat-card.submitted .stat-icon{background:var(--c-green-pale);color:var(--c-green-deep);}
  .stat-card.dept .stat-icon{background:var(--c-sky-pale);color:var(--c-sky-deep);}
  .stat-card.done .stat-icon{background:var(--c-green-tint);color:var(--c-green-deep);}
  .stat-card.revise .stat-icon{background:var(--c-red-pale);color:var(--c-red-deep);}

  /* ── สองคอลัมน์: รายการรอดำเนินการ / ผลงานล่าสุด ── */
  .dash-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:start;}
  .dash-panel{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px 20px 22px;}
  .dash-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;}
  .dash-panel-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;}
  .dash-panel-link{font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none;display:flex;align-items:center;gap:4px;white-space:nowrap;}

  .pending-item{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-soft);}
  .pending-item:last-child{border-bottom:none;padding-bottom:0;}
  .pending-item-title{font-weight:700;font-size:13.5px;}
  .pending-item-sub{font-size:12px;color:var(--text2);margin-top:2px;}
  .pending-item-reason{font-size:11.5px;color:var(--c-red-deep);margin-top:4px;}

  .mini-cert-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mini-cert{background:var(--bg-alt);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;transition:box-shadow .15s;}
  .mini-cert:hover{box-shadow:0 4px 14px rgba(0,0,0,.08);}
  .mini-cert-title{font-size:12.5px;font-weight:700;color:var(--text);line-height:1.35;}
  .mini-cert-sub{font-size:11px;color:var(--text3);}

  @media (max-width:900px){
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .dash-grid{grid-template-columns:1fr;}
  }
  @media (max-width:640px){
    .profile-card{padding:16px;}
    .mini-cert-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div id="loadingOverlay"><div class="spinner"></div><p style="color:var(--text2);font-size:14px;font-weight:700;">กำลังตรวจสอบสิทธิ์...</p></div>
<div id="toast"></div>

<div class="navbar blue"><div class="navbar-inner">
  <div class="navbar-brand">
    <button class="navbar-menu-btn" id="navMenuBtn" title="เมนู" onclick="toggleSidebar(event)"><i data-lucide="menu" style="width:18px;height:18px"></i></button>
    <img class="navbar-mark-img" src="https://firebasestorage.googleapis.com/v0/b/np-webapp-74616.firebasestorage.app/o/img%2Flogo_np.gif?alt=media&token=caa0869b-c98f-4ad3-8ee9-930e8789602e" alt="ตราโรงเรียนหนองกี่พิทยาคม">
    <div><div class="navbar-title">NP-TCAS Verified</div><div class="navbar-subtitle">โรงเรียนหนองกี่พิทยาคม</div></div>
  </div>
  <div class="navbar-user" id="navbarUser"><span id="userLabel"></span><img id="userAvatar" class="navbar-avatar" alt="บัญชีผู้ใช้"><button class="navbar-logout" onclick="signOutUser()" title="ออกจากระบบ"><i data-lucide="log-out" style="width:16px;height:16px"></i></button></div>
</div></div>

<div id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="shell">
  <div class="sidebar" id="sidebar">
    <button class="sidebar-close-btn" onclick="closeSidebar()"><i data-lucide="x" style="width:16px;height:16px"></i></button>
    <a class="sidebar-btn active" href="dashboard.html"><i data-lucide="layout-dashboard" style="width:18px;height:18px"></i>แดชบอร์ด</a>
    <a class="sidebar-btn" href="student-portfolio.html"><i data-lucide="award" style="width:18px;height:18px"></i>แฟ้มผลงาน</a>
    <a class="sidebar-btn" href="onboarding.html"><i data-lucide="user-circle" style="width:18px;height:18px"></i>ข้อมูลส่วนตัว</a>
    <a class="sidebar-btn" href="student-history.html"><i data-lucide="history" style="width:18px;height:18px"></i>ประวัติการส่ง</a>
  </div>
  <div class="content">
    <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px;">
      <div>
        <div class="page-title">แดชบอร์ด</div>
        <div class="page-sub">ภาพรวมกิจกรรมและสถานะการยืนยันของคุณ</div>
      </div>
      <button class="btn-primary" onclick="openSubmitModal()"><i data-lucide="plus" style="width:15px;height:15px"></i>ส่งกิจกรรมใหม่</button>
    </div>

    <div class="profile-card" id="profileCard"></div>

    <div class="stat-grid" id="statGrid"></div>

    <div class="dash-grid">
      <div class="dash-panel">
        <div class="dash-panel-head">
          <div class="dash-panel-title"><i data-lucide="hourglass" style="width:17px;height:17px;color:var(--accent)"></i>รายการที่กำลังรอดำเนินการ</div>
          <a class="dash-panel-link" href="student-history.html">ดูทั้งหมด <i data-lucide="chevron-right" style="width:14px;height:14px"></i></a>
        </div>
        <div id="pendingList"></div>
        <div id="pendingEmpty" class="empty-state" style="display:none;padding:20px 0;">
          <i data-lucide="check-circle-2" style="width:30px;height:30px;margin-bottom:8px;"></i>
          <div>ไม่มีรายการค้างดำเนินการตอนนี้</div>
        </div>
      </div>

      <div class="dash-panel">
        <div class="dash-panel-head">
          <div class="dash-panel-title"><i data-lucide="award" style="width:17px;height:17px;color:var(--accent)"></i>ผลงานล่าสุดที่ยืนยันแล้ว</div>
          <a class="dash-panel-link" href="student-portfolio.html">ดูทั้งหมด <i data-lucide="chevron-right" style="width:14px;height:14px"></i></a>
        </div>
        <div class="mini-cert-grid" id="miniCertGrid"></div>
        <div id="certifiedEmpty" class="empty-state" style="display:none;padding:20px 0;">
          <i data-lucide="award" style="width:30px;height:30px;margin-bottom:8px;"></i>
          <div>ยังไม่มีผลงานที่ยืนยันแล้ว</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="shared/firebase-init.js"></script>
<script src="shared/auth-guard.js"></script>
<script src="shared/status-meta.js"></script>
<script src="shared/submit-modal.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
